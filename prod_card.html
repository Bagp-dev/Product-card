<!DOCTYPE html>
<html>
    <head>
        <meta charset = "UTF-8">
       
        <meta name="viewport" content="width=device-width, initial-scale= 1.0">

        <title> Product card </title>
        <link rel="stylesheet", href="style_productcard.css">
    </head>
    <body>
        <section class="card">
            <div id="img">
                <img src="rose mask img.png" alt="Rose mask", id="img">
            </div>
            <div class="info">   
                <h3 id="produto">Máscara Líquida</h3>
                <h1 id="titulo">ROSE</h1>
                <h2 id="subtitulo">LIQUID MASK</h2>
                <h5 id="marca">MAMONDE</h5>
                <p>
                    Máscara líquida que tras <em>renovação</em>
                    e <em>glow</em> para sua pele atraves da natureza.
                </p>
                <div class="valor">
                    <span id="preço_atual">$ 75</span>
                    <span id="preço_antigo"><s>$ 150</s></span>
                </div>
                <div class="circulos">
                    <div class="amarelo"></div>
                    <div class="roxo"></div>
                    <div class="rosa"></div>
                    <div class="linha"></div>
                    <h6 id="cor">Flora glow</h6>
                </div>
                <button>
                    <img src="Favorite Cart.png" alt="carrinho" id="carrinho">
                    <span id="botao">Add to cart</span>
                </button>
            </div> 
            <div class="heart">
                <img src="Favorite.png" alt="favoritar", id="like">
            </div>
            </section>
        </section>

    </body>
</html>
